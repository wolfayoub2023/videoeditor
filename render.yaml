services:
  - type: web
    name: video-editor-api
    env: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11

  - type: static
    name: video-editor-template-ui
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
